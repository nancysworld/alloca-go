name: CI

# Reproducibility is an AG-M0 exit criterion: CI must build and test the minimal
# service deterministically. go.mod distinguishes the module language version (the
# `go` directive) from the exact compiler (`toolchain go1.26.5`); actions/setup-go
# reads go-version-file and honours the toolchain line, so CI and every measurement
# use the same compiler patch version. The `go` directive alone is NOT the pin —
# the `toolchain` directive is. golangci-lint is pinned below and mirrored by the
# Makefile so the local and remote lint gates are identical.

# `push` is restricted to main rather than "**". Listening to both events meant every push to an
# open PR branch started two identical runs of the whole workflow — one for `push`, one for
# `pull_request` — on the same SHA, doubling Actions minutes for ordinary development. An open PR
# now gets one hosted run per update, and main gets one after merge. `make ci` remains the local
# pre-push gate and runs the same checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build, test, race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (formatting gate)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: race test
        run: go test -race ./...

      # Guards the container image's provenance: .dockerignore may exclude only paths git
      # already ignores. Excluding a tracked path makes git report it as deleted inside the
      # build context, which stamps the binary vcs.modified=true and makes every run against
      # the image unquotable at the floor of the ladder. Cheap, and needs no daemon.
      - name: build context (docker provenance gate)
        run: ./test/scripts/check-build-context.sh

      # Guards the Iteration C rehearsal's CPU layout check, which is what refuses a bad
      # partition before an image build and four database containers. It is bash, so the Go
      # suite says nothing about it, and its comments once described four properties its code
      # did not enforce (ag-sept-pr4.md §3.7). Needs bash, taskset and a few CPUs; the cases
      # that assert the full 12-CPU partition skip on a smaller runner, the negative cases fit
      # in four and run here.
      - name: iteration C cpu layout check
        run: ./test/scripts/itc-cpu-layout-test.sh

      # Guards itc-topology-check.sh's container-set logic, which decides whether the topology
      # about to be measured is the one selected. It stubs `docker`, so it needs no daemon: the
      # property is set arithmetic over container names. It exists because that check counted the
      # observability stack as topology units and refused a correct G4 (ag-sept-pr4.md §3).
      - name: iteration C topology check logic
        run: ./test/scripts/itc-topology-check-test.sh

      # Guards the label that says which experiment a retained sample belongs to. prometheus.yml
      # once set topology=single-instance-local job-wide, so every Iteration C sample was stamped
      # as the PR2 experiment — and nothing reported it, because the label was present and
      # well-formed. Pure text generation plus two static reads, so no daemon.
      - name: iteration C observability labels
        run: ./test/scripts/itc-obs-targets-test.sh

      # Guards the PR4b saturation search, which chooses the two worker levels that receive four
      # retained 600 s runs each. It substitutes a synthetic rate curve for the prober, so it
      # drives no cell and needs no daemon. It exists because the search runs unattended for the
      # better part of an hour and a defect returns a wrong bracket full of sound runs — and
      # because mutation testing on it found one assertion passing for the wrong reason
      # (ag-sept-validation-plan.md §4.6.4).
      - name: iteration C reconnaissance walk
        run: ./test/scripts/itc-recon-walk-test.sh

      # Guards the knee decision that separates VAL-SCALE-6 established from VAL-SCALE-6 explicitly
      # unresolved, and the efficiencies derived from it. The cases write the manifests the analysis
      # reads, so no cell is driven. It exists because a defect in the rule yields a plausible
      # efficiency rather than an obviously wrong one — the number a report is most likely to quote
      # (ag-sept-validation-plan.md §4.6.5, §4.6.7).
      - name: iteration C capacity result rule
        run: ./test/scripts/itc-capacity-result-test.sh

  integration:
    name: postgres integration
    runs-on: ubuntu-latest

    # The AG-M1 gates that need real concurrent SQL — capacity safety under contention,
    # the post-lock decision timestamp, the scoped-key race — cannot be established
    # against a double. They run here, against a real PostgreSQL, under the race
    # detector.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alloca
          POSTGRES_PASSWORD: alloca
          POSTGRES_DB: alloca
        ports:
          - 5432:5432
        # Without a health check the job can start querying before the server accepts
        # connections, which fails as a confusing connection error rather than a wait.
        options: >-
          --health-cmd "pg_isready -U alloca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: integration tests
        env:
          DATABASE_URL: postgres://alloca:alloca@localhost:5432/alloca?sslmode=disable
        run: go test -tags=integration -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned for lint reproducibility. MUST match GOLANGCI_LINT_VERSION in the
          # Makefile so `make ci` locally and CI run the identical linter; bump both
          # together.
          version: v2.12.2
