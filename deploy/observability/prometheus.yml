# Prometheus configuration for AG-Sept PR2's single-instance frontier.
#
# Deliberately one job. PR2 measures one service process on one host, and a scrape config that
# enumerated targets it does not have would be the start of the general observability platform
# measurement-contract §6 excludes.
global:
  # 1s, not the 15s default. A sweep cell runs for tens of seconds, so a 15s interval would
  # give a handful of points across the whole measurement and would alias the pool-pressure
  # signal the frontier is read from. The cost is storage, which the retention window bounds.
  scrape_interval: 1s
  scrape_timeout: 900ms

scrape_configs:
  - job_name: alloca-go
    # File-based discovery rather than a static target, because the address that reaches the
    # service is not knowable at commit time.
    #
    # The service runs on the host; Prometheus runs in a container. Under Docker Desktop on
    # WSL2 those are two *different* WSL distros, so neither `host.docker.internal` (which
    # resolves to the Windows host) nor the compose bridge gateway reaches this one — both
    # answer "connection refused", which reads exactly like a service that is not running.
    # What does reach it is this distro's own eth0 address, and that is reassigned whenever
    # WSL restarts.
    #
    # So `make obs-up` probes for an address that actually works and writes it here. The
    # scrape *configuration* stays version-controlled; only the discovered address does not.
    # Prometheus re-reads this file without a restart, so a changed address is picked up by
    # re-running the probe.
    file_sd_configs:
      - files: ['/etc/prometheus/targets/*.json']
        refresh_interval: 10s

    # Attached to every sample this job stores, so a retained TSDB snapshot still says what it
    # was measuring once it is separated from the run directory that explains it.
    #
    # relabel_configs rather than external_labels, which is what this originally used and got
    # wrong: external_labels are applied when Prometheus talks to *external* systems — remote
    # write, federation, alerting — and are not attached to locally ingested samples. The
    # snapshot would not have carried them, while the config claimed it did.
    #
    # Only `milestone` is set here, because it is the one fact that is true of every target this
    # job will ever scrape. The run manifest remains the authoritative environment identity —
    # this label makes an orphaned snapshot self-describing, it does not replace it.
    #
    # **`topology` is deliberately NOT set here, and must not be.** It was, unconditionally, as
    # `single-instance-local` — and that silently mislabelled every Iteration C rehearsal sample
    # as the PR2 single-instance experiment, because a static relabel cannot know which topology
    # the discovered targets belong to. The retained G4 cells in
    # docs/measurements/pr4a-rehearsal/ carry the wrong label for exactly this reason.
    #
    # Topology is a property of *which targets were discovered*, so the target document owns it:
    # obs-target.sh stamps `single-instance-local` on the PR2 host target, itc-obs-targets.sh
    # stamps `itc-g1`/`itc-g2`/`itc-g4` on the rehearsal units. A label that is true of some
    # targets and not others belongs with the targets, never in a job-wide rule.
    #
    # test/scripts/itc-obs-targets-test.sh fails if this relabel comes back.
    relabel_configs:
      - target_label: milestone
        replacement: ag-sept
