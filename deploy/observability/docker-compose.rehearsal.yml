# The local partitioned rehearsal overlay for the observability stack (ag-sept-pr4.md §2.14).
#
# Applied on top of docker-compose.yml to confine Prometheus and Grafana to the generator and
# monitoring CPU set, so the whole measuring side of the rehearsal sits outside the capacity
# units' CPUs.
#
#   docker compose -f docker-compose.yml -f docker-compose.rehearsal.yml ...
#
# **Monitoring is part of the generator side, not part of the environment.** §2.14 partitions the
# machine into capacity units and one generator/monitor set; that set is named for both. A
# Prometheus left unpinned lands wherever the scheduler likes, and it is not idle — it scrapes
# every unit on a short interval, compacts its TSDB, and answers the queries an operator runs
# while a cell is in flight. That work landing on CPUs 0-7 is contention inside a capacity unit
# that no artifact records, and it grows with the number of units, so it biases G4 harder than
# G1 — against exactly the comparison E2 and E4 are derived from.
#
# **The default is 8-11, and the control widens it to 8-15.** ITC_CPUS_GENERATOR is one value for
# the whole measuring side: alloca-load is confined to it by test/scripts/itc-run.sh, and these
# two containers by this file. Widening it for the generator-headroom control has to widen it
# here too, or the control would change the generator's share while monitoring kept its old one
# and the comparison would carry a second difference.
#
# Grafana shares Prometheus's set deliberately. It is browsed by a human during a run and its
# query load lands on Prometheus anyway; splitting them would spend a capacity unit's CPU on a
# dashboard.

# **Prometheus joins the topology's network; Grafana does not.** Prometheus is the only container
# that has to reach the units, and it reaches them by their Compose service names on that network
# (`service-1:9090`), which is stable across WSL restarts in a way a discovered host address is
# not — the PR2 path rediscovers an eth0 address that WSL reassigns, and that address had already
# gone stale here. Grafana talks to Prometheus over the observability network and has no reason to
# see the units; attaching it too would put a dashboard on the measured topology's network for
# nothing.
#
# The network is external because the topology owns it. Compose creates `alloca-topology_default`
# when `make itc-rehearse` raises the units, so this file must attach to it rather than declare
# it — declaring it would create a second, empty network with a mangled name and every scrape
# would fail with a DNS error that looks like the units being down.
#
# **This does not put Prometheus inside a capacity unit.** A container network is not a CPU set:
# Prometheus stays pinned to ITC_CPUS_GENERATOR, and joining the topology's bridge changes only
# which names it can resolve.
services:
  prometheus:
    cpuset: "${ITC_CPUS_GENERATOR:-8-11}"
    networks:
      - default
      - topology

  grafana:
    cpuset: "${ITC_CPUS_GENERATOR:-8-11}"

  # Pinned for cost, not for correctness. It reads the host's namespaces, so what it reports is
  # the same wherever it runs — but scraping six collectors every 5s is work, and unpinned that
  # work lands on whichever CPU the scheduler picks, which on this partition means inside a
  # capacity unit's set. It measures the machine; it must not perturb the units it measures.
  node-exporter:
    cpuset: "${ITC_CPUS_GENERATOR:-8-11}"

  # --- PostgreSQL wait-event evidence (ag-sept-pr4.md §3.16) ---------------------------------
  #
  # **Why these exist at all.** §3.13 made the exporter conditional — "decide from evidence
  # whether PostgreSQL-side instrumentation is necessary; do not add the exporter merely because
  # PostgreSQL is plausible". That condition is now discharged rather than waived. node_exporter
  # and the fuller pool series are both in, and between them they exclude the host: during a
  # degraded cell throughput falls 5x, service CPU 4x and iowait 4x while host CPU, run queue and
  # steal are flat, and the pool sits pegged at 4/4 in healthy and degraded cells alike. What is
  # left is a database holding each connection about five times longer for no reason any existing
  # instrument can see. Checkpoints and autovacuum were the two named candidates and both are
  # refuted from retained logs (§3.15).
  #
  # **What they add that nothing else does: `wait_event_type` and `wait_event`.** Those are
  # labels on `pg_stat_activity_count`, and they say what a backend is blocked *on* — `Lock`,
  # `LWLock`, `IO`, `BufferPin`, `Client` — rather than that it is slow. Verified live against
  # this topology before the wiring was written: a deliberately blocked backend reported
  # `wait_event_type="Lock", wait_event="relation"` and idle clients `Client/ClientRead`.
  #
  # **They live in the overlay, not the base file**, because the base file is PR2's path: a
  # service on the host and no Iteration C topology to point a per-authority exporter at. A
  # service defined only here is created only when the overlay is applied, which is exactly the
  # `make obs-rehearse` path — and this file already owns the topology network they need.
  #
  # **Pinned to the generator set, like everything else on the measuring side.** An exporter
  # queries the database it observes, so unpinned it would spend a capacity unit's CPU observing
  # that same unit. This is the observer effect the partition exists to bound, and it is the one
  # cost the log-based diagnostics do not have.
  #
  # **The collector set is cut to what the diagnosis needs.** The default set is ~380 metric
  # families per target and every one of them is a query against the database under test and a
  # series in every retained snapshot. `settings` alone is three hundred static values re-read on
  # every scrape; the series that matter are recorded once per series into `postgres-settings.txt`
  # by test/scripts/itc-series.sh instead. Collect narrowly here, unlike node_exporter, precisely
  # because this exporter's collection lands on the measured database rather than on the host.
  postgres-exporter-1: &pgexp
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: alloca-postgres-exporter-1
    cpuset: "${ITC_CPUS_GENERATOR:-8-11}"
    restart: "no"
    environment:
      DATA_SOURCE_NAME: "postgresql://alloca:alloca@authority-1-db:5432/alloca?sslmode=disable"
    command:
      - '--collector.stat_activity'
      - '--collector.stat_database'
      - '--collector.stat_progress_vacuum'
      - '--collector.stat_bgwriter'
      - '--collector.locks'
      - '--collector.long_running_transactions'
      # **`stat_user_tables` is off because it blocks, and a blocked exporter is worse than no
      # exporter.** Measured against this topology: holding an ACCESS EXCLUSIVE lock on one table
      # makes a scrape with this collector hang indefinitely — curl gave up at 20 s — while the
      # set above answers in 0.014 s under the identical lock. Prometheus would mark the target
      # down and retain nothing, so the instrument would go blind in precisely the situation it
      # was added to observe. It costs `n_dead_tup` and the per-table vacuum counters, which is a
      # real loss and the reason the dead-tuple panel is not in panels.json; the autovacuum
      # question it would have answered is already settled by the server log (§3.15), and that
      # path cannot be blocked by a lock.
      - '--no-collector.stat_user_tables'
      # Not available before PostgreSQL 17 — the exporter logs a warning on every single scrape
      # and produces nothing. Off rather than left to be noisy about its own uselessness.
      - '--no-collector.stat_checkpointer'
      - '--no-collector.settings'
      - '--no-collector.statio_user_tables'
      - '--no-collector.statio_user_indexes'
      - '--no-collector.replication'
      - '--no-collector.replication_slots'
      - '--no-collector.stat_wal_receiver'
      - '--no-collector.stat_archiver'
      - '--no-collector.xlog_location'
      - '--no-collector.roles'
      - '--no-collector.database_wraparound'
      - '--no-collector.buffercache_summary'
      - '--no-collector.postmaster'
      - '--no-collector.process_idle'
      - '--no-collector.stat_statements'
    networks:
      - default
      - topology

  # Units 2-4 carry the same profiles as the databases they observe, so an exporter cannot be
  # raised for an authority that is not running and cannot be missing for one that is. The
  # environment block is written out in full because a service that declares `environment:`
  # replaces the anchor's map rather than merging into it — the same trap the topology compose
  # documents for its own anchors.
  postgres-exporter-2:
    <<: *pgexp
    container_name: alloca-postgres-exporter-2
    profiles: ["g2", "g4"]
    environment:
      DATA_SOURCE_NAME: "postgresql://alloca:alloca@authority-2-db:5432/alloca?sslmode=disable"

  postgres-exporter-3:
    <<: *pgexp
    container_name: alloca-postgres-exporter-3
    profiles: ["g4"]
    environment:
      DATA_SOURCE_NAME: "postgresql://alloca:alloca@authority-3-db:5432/alloca?sslmode=disable"

  postgres-exporter-4:
    <<: *pgexp
    container_name: alloca-postgres-exporter-4
    profiles: ["g4"]
    environment:
      DATA_SOURCE_NAME: "postgresql://alloca:alloca@authority-4-db:5432/alloca?sslmode=disable"

networks:
  topology:
    external: true
    name: alloca-topology_default
