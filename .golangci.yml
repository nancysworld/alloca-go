# golangci-lint configuration (schema v2).
#
# The linter set is deliberately conservative for a young repository: the standard
# bundle (errcheck, govet, ineffassign, staticcheck, unused) plus gofmt formatting.
# Stricter style linters (e.g. revive) can be layered in once a green baseline is
# observed in CI. Keep additions incremental so a new check never silently blocks
# unrelated work.
version: "2"

run:
  timeout: 5m
  # Lint the build-tagged integration tests too. Without this they are invisible to
  # the linter, and test code that never gets linted is exactly where dead helpers and
  # unchecked errors accumulate.
  build-tags:
    - integration

linters:
  default: standard

formatters:
  enable:
    - gofmt
