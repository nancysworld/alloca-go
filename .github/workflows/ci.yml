name: CI

# Reproducibility is an AG-M0 exit criterion: CI must build and test the minimal
# service deterministically. go.mod distinguishes the module language version (the
# `go` directive) from the exact compiler (`toolchain go1.26.5`); actions/setup-go
# reads go-version-file and honours the toolchain line, so CI and every measurement
# use the same compiler patch version. The `go` directive alone is NOT the pin —
# the `toolchain` directive is. golangci-lint is pinned below and mirrored by the
# Makefile so the local and remote lint gates are identical.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build, test, race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (formatting gate)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: race test
        run: go test -race ./...

      # Guards the container image's provenance: .dockerignore may exclude only paths git
      # already ignores. Excluding a tracked path makes git report it as deleted inside the
      # build context, which stamps the binary vcs.modified=true and makes every run against
      # the image unquotable at the floor of the ladder. Cheap, and needs no daemon.
      - name: build context (docker provenance gate)
        run: ./test/scripts/check-build-context.sh

  integration:
    name: postgres integration
    runs-on: ubuntu-latest

    # The AG-M1 gates that need real concurrent SQL — capacity safety under contention,
    # the post-lock decision timestamp, the scoped-key race — cannot be established
    # against a double. They run here, against a real PostgreSQL, under the race
    # detector.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alloca
          POSTGRES_PASSWORD: alloca
          POSTGRES_DB: alloca
        ports:
          - 5432:5432
        # Without a health check the job can start querying before the server accepts
        # connections, which fails as a confusing connection error rather than a wait.
        options: >-
          --health-cmd "pg_isready -U alloca"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: integration tests
        env:
          DATABASE_URL: postgres://alloca:alloca@localhost:5432/alloca?sslmode=disable
        run: go test -tags=integration -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned for lint reproducibility. MUST match GOLANGCI_LINT_VERSION in the
          # Makefile so `make ci` locally and CI run the identical linter; bump both
          # together.
          version: v2.12.2
