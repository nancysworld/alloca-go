# Prometheus + Grafana for AG-Sept PR2. Brought up by `make obs-up`.
#
# Scope, from measurement-contract §6: a *minimal reproducible retention path* and a *compact
# diagnostic dashboard*, not an observability platform. So: two containers, one scrape job,
# one dashboard, no alerting, no exporters beyond what the service already serves.
#
# The service under test deliberately runs on the host rather than in this project. PR2
# measures a locally built binary (`make dev-measured`), and containerising the service is
# PR3's scope — putting it here would pull PR3's variable into PR2's numbers.

name: alloca-obs

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: alloca-prometheus
    # Makes host.docker.internal exist on a plain Linux daemon, where it otherwise does not.
    # It is the first address obs-target.sh probes, and on a non-WSL host it is usually the
    # one that works. Under Docker Desktop on WSL2 it resolves to the *Windows* host and the
    # probe falls through to this distro's own address — see test/scripts/obs-target.sh.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # Retention is time- and size-bounded. A 1s scrape interval fills disk faster than the
      # default assumes, and an unbounded local TSDB is how a workstation runs out of space
      # mid-sweep — which loses the run *and* the evidence.
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=2GB'
      # Required for /api/v1/admin/tsdb/snapshot, which is how a cell's evidence is retained.
      # A snapshot is a hard-linked copy of the TSDB blocks, so it is cheap and complete —
      # the alternative, re-querying later, cannot survive the retention window.
      - '--web.enable-admin-api'
    ports:
      - '9091:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Discovered scrape targets, written by test/scripts/obs-target.sh. Git-ignored: the
      # address is a property of this machine's WSL networking, not of the project.
      - ./targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus

  # VAL-NEG-7's host sensor (ag-sept-pr4.md §2.1). Added in PR4a because §3.12 produced a
  # degraded cell that service and pool metrics could not explain: throughput and service CPU
  # both fell, which is consistent with a stall anywhere below or around the service, and
  # nothing in the deployment could see the host to tell those apart.
  #
  # **One exporter, because the local rehearsal has one host.** §2.1 asks for node_exporter on
  # every capacity-unit host and on the generator/monitor host; on this workstation all four
  # shard groups and the generator share a single WSL VM, so one exporter observes all of them
  # and a second would report the same kernel twice. PR4b's independently provisioned topology
  # is where the set becomes plural — and that is the point of the exercise, since a shared
  # kernel is exactly what makes the local numbers rehearsal evidence rather than capacity
  # evidence.
  #
  # It measures the host, so it is pinned with the rest of the measuring side rather than left
  # to land on a capacity unit's CPUs (rehearsal overlay).
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: alloca-node-exporter
    # The host's PID namespace, so process-level host state is the host's rather than this
    # container's view of itself.
    pid: host
    command:
      # Read the host's namespaces through bind mounts rather than the container's own, which
      # would otherwise describe the container: its cgroup CPU count, its filesystem, its
      # network. That is the failure mode where every series is present, plausible, and about
      # the wrong machine.
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      # Restricted collector set (§2.3). The default set is orders of magnitude more series per
      # target, and the retained-evidence path pays for every one of them in snapshot size. These
      # six are what the §3.12 diagnosis actually needs: whether the host was starved of CPU,
      # short of memory, blocked on disk, saturated on the network, out of space, or — the one
      # that answers the question most directly — under kernel-reported resource pressure.
      - '--collector.disable-defaults'
      - '--collector.cpu'
      - '--collector.meminfo'
      - '--collector.diskstats'
      - '--collector.netdev'
      - '--collector.filesystem'
      # Kept although this kernel cannot serve it. PSI (/proc/pressure) is the most direct answer
      # to "was the host stalling rather than merely busy", and it is absent on the WSL2 kernel
      # this rehearsal runs on — `node_scrape_collector_success{collector="pressure"}` reads 0
      # here (§3.14). Left enabled so the AWS hosts, whose kernels do carry it, collect it without
      # a config change; a failed collector costs one series and reports itself.
      - '--collector.pressure'
      # The substitute while PSI is unavailable: run-queue depth against CPU count is the classic
      # oversubscription signal, and unlike utilisation it rises when work is waiting rather than
      # when work is being done.
      - '--collector.loadavg'
      # Bind mounts are read-only, but the filesystem collector would still walk container and
      # overlay mounts and report them as host filesystems.
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|host/(proc|sys))($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    # Not published on the host. Prometheus reaches it by service name on this network, and a
    # published port would be one more thing an operator could scrape by accident.
    expose:
      - '9100'

  grafana:
    image: grafana/grafana:11.5.1
    container_name: alloca-grafana
    depends_on:
      - prometheus
    environment:
      # Anonymous admin access: this is a workstation diagnostic tool reachable only on
      # localhost, and a login prompt between an operator and a running sweep is friction
      # with nothing to protect. It must never be how a deployed Grafana is configured.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      # Off by default and named here so nobody has to wonder whether the container is
      # phoning home during a measured run.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
    ports:
      - '3000:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  # Named rather than a bind mount: the TSDB is Prometheus's own format and nothing in the
  # repo should be tempted to read it directly. Evidence leaves via the snapshot API.
  prometheus-data:
